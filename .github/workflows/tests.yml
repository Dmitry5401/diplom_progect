name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser'
        default: 'chrome'
      browserVersion:
        description: 'Browser version (empty = latest)'
        default: ''
      browserSize:
        description: 'Browser window size'
        default: '1920x1080'
      headless:
        description: 'Run browser headless'
        default: 'true'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run tests
        run: >
          ./gradlew clean test
          -Dbrowser=${{ github.event.inputs.browser || 'chrome' }}
          -DbrowserVersion=${{ github.event.inputs.browserVersion || '' }}
          -DbrowserSize=${{ github.event.inputs.browserSize || '1920x1080' }}
          -Dheadless=${{ github.event.inputs.headless || 'true' }}

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: build/allure-results
          if-no-files-found: ignore

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore
